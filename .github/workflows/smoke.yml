name: Smoke Monitor (v2)

on:
  workflow_dispatch:
  # Enable after repository secrets are configured:
  # schedule:
  #   - cron: "*/10 * * * *"

permissions:
  contents: read

concurrency:
  group: clinic-monitoring-v2-smoke
  cancel-in-progress: true

jobs:
  smoke:
    name: Login and logout smoke test
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python and browser dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run smoke monitor
        env:
          BASE_APP_URL: https://clinic.peoplesdoctor.ai
          TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
        run: pytest tests/smoke/test_login_logout.py

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-v2-failure-evidence
          path: test-results/
          if-no-files-found: warn
          retention-days: 14
