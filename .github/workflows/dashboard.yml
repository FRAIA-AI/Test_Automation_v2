name: Monitoring Dashboard (v2)

on:
  workflow_dispatch:

  schedule:
    # Refresh public dashboard data every 15 minutes.
    - cron: "7,22,37,52 * * * *"

  workflow_run:
    workflows:
      - "Smoke Monitor (v2)"
      - "Consultation Regression (v2)"
      - "FNX Parser and AI (v2)"
    types:
      - completed

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: clinic-monitoring-v2-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build monitoring dashboard
    runs-on: ubuntu-22.04
    timeout-minutes: 12

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare dashboard HTML and assets
        run: |
          rm -rf public .dashboard-work
          mkdir -p public
          python scripts/prepare_dashboard_assets.py

      - name: Build GitHub Actions data and latest evidence
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/build_dashboard_data.py

      - name: Apply final dashboard v3 UI and chart upgrades
        run: |
          python scripts/postprocess_dashboard.py

      - name: Verify generated dashboard
        shell: bash
        run: |
          test -f public/index.html
          test -f public/data/dashboard.json
          grep -q "dashboard-v3-runtime" public/index.html
          grep -q "Dashboard v3" public/index.html

          echo "Generated dashboard content:"
          find public \
            -maxdepth 4 \
            -type f \
            -printf '%p %k KB\n' \
            | sort

          echo "Dashboard JSON preview:"
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("public/data/dashboard.json").read_text())
          print("generated_at:", data.get("generated_at"))
          for key, monitor in data.get("monitors", {}).items():
              latest = monitor.get("latest_completed") or monitor.get("latest") or {}
              print(key, latest.get("conclusion"), latest.get("updated_at"), len(monitor.get("history", [])))
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    name: Deploy monitoring dashboard
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-22.04
    needs: build
    timeout-minutes: 10

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
