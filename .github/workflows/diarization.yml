name: Diarization and Clinical Note Evaluation (v2)

on:
  workflow_dispatch:
    inputs:
      evaluate_clinical_notes:
        description: "Run the AI clinical-note evaluation after collection"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: clinic-monitoring-v2-diarization
  cancel-in-progress: false

jobs:
  diarization:
    name: Collect diarization evidence and evaluate clinical notes
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python and browser dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Collect diarization and generated-note evidence
        env:
          BASE_APP_URL: https://clinic.peoplesdoctor.ai
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          AUTH_COOKIE_NAME: ${{ secrets.AUTH_COOKIE_NAME }}
          DIARIZATION_CASES_DIR: test_data/diarization
        run: |
          pytest tests/diarization/test_diarization_batch.py -v \
            --junitxml=results/diarization-junit.xml

      - name: Evaluate clinical-note fidelity
        if: ${{ inputs.evaluate_clinical_notes }}
        env:
          DIARIZATION_CASES_DIR: test_data/diarization
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_EVALUATION_MODEL: gpt-5.6-luna
        run: python tests/diarization/evaluate_diarization_ai.py

      - name: Upload diarization evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diarization-v2-evidence-${{ github.run_id }}
          path: |
            results/diarization/
            results/diarization-junit.xml
          if-no-files-found: warn
          retention-days: 14
