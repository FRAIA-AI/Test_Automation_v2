name: Consultation Regression (v2)

on:
  workflow_dispatch:
  # Enable after repository secrets are configured:
  # schedule:
  #   - cron: "0 * * * *"

permissions:
  contents: read

concurrency:
  group: clinic-monitoring-v2-regression
  cancel-in-progress: false

jobs:
  regression:
    name: Direct consultation and note journey
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python and browser dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run consultation regression
        env:
          BASE_APP_URL: https://clinic.peoplesdoctor.ai
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          AUTH_COOKIE_NAME: ${{ secrets.AUTH_COOKIE_NAME }}
        run: pytest tests/regression/test_consultation.py

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: regression-v2-failure-evidence
          path: test-results/
          if-no-files-found: warn
          retention-days: 14
