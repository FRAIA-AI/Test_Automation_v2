name: Consultation Regression (v2)

on:
  workflow_dispatch:

  schedule:
    - cron: "0 * * * *"

permissions:
  contents: read

concurrency:
  group: clinic-monitoring-v2-regression
  cancel-in-progress: false

jobs:
  regression:
    name: Direct consultation and note journey

    runs-on: ubuntu-22.04

    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python and browser dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Restore regression alert state
        uses: actions/cache/restore@v4
        with:
          path: results/alert-state-regression.json
          key: clinic-monitoring-alert-regression-${{ github.run_id }}
          restore-keys: |
            clinic-monitoring-alert-regression-

      - name: Run consultation regression
        id: monitor
        continue-on-error: true

        env:
          BASE_APP_URL: https://clinic.peoplesdoctor.ai
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          AUTH_COOKIE_NAME: ${{ secrets.AUTH_COOKIE_NAME }}

        shell: bash

        run: |
          mkdir -p results
          mkdir -p test-results

          set +e
          set -o pipefail

          pytest tests/regression/test_consultation.py \
            -v \
            --junitxml=results/regression-junit.xml \
            2>&1 | tee results/regression-output.txt

          TEST_EXIT_CODE=${PIPESTATUS[0]}

          echo "exit_code=$TEST_EXIT_CODE" >> "$GITHUB_OUTPUT"

          if [ "$TEST_EXIT_CODE" -eq 0 ]; then
            echo "monitor_status=success" >> "$GITHUB_OUTPUT"
          else
            echo "monitor_status=failure" >> "$GITHUB_OUTPUT"
          fi

          exit 0

      - name: Show captured evidence
        if: always()
        shell: bash
        run: |
          echo "Stage screenshots:"
          find test-results/stage-screenshots \
            -maxdepth 1 \
            -type f \
            -printf '%f %k KB\n' 2>/dev/null || true

          echo "Failure screenshots:"
          find test-results/failure-screenshots \
            -maxdepth 1 \
            -type f \
            -printf '%f %k KB\n' 2>/dev/null || true

          echo "Videos:"
          find test-results/videos \
            -maxdepth 1 \
            -type f \
            -printf '%f %k KB\n' 2>/dev/null || true

          echo "Traces:"
          find test-results/traces \
            -maxdepth 1 \
            -type f \
            -printf '%f %k KB\n' 2>/dev/null || true

      - name: Upload regression evidence
        if: always()

        uses: actions/upload-artifact@v4

        with:
          name: regression-v2-evidence-${{ github.run_id }}

          path: |
            test-results/
            results/regression-output.txt
            results/regression-junit.xml

          if-no-files-found: warn

          retention-days: 14

      - name: Process regression email alerts
        if: always()

        env:
          MAIL_SERVER_ADDRESS: ${{ secrets.MAIL_SERVER_ADDRESS }}
          MAIL_SERVER_PORT: ${{ secrets.MAIL_SERVER_PORT }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_SENDER_ADDRESS: ${{ secrets.MAIL_SENDER_ADDRESS }}
          MAIL_RECIPIENT_ADDRESS: ${{ secrets.MAIL_RECIPIENT_ADDRESS }}

          # Maximum combined attachment size.
          # Lower this when your SMTP provider has a smaller limit.
          MAX_EMAIL_ATTACHMENT_MB: "20"

        run: |
          python scripts/send_alert.py \
            --monitor "Peoples Clinic Consultation Regression" \
            --status "${{ steps.monitor.outputs.monitor_status || 'failure' }}" \
            --state-file results/alert-state-regression.json \
            --junit-file results/regression-junit.xml \
            --evidence-root test-results \
            --cooldown-minutes 60

      - name: Save regression alert state
        if: always()

        uses: actions/cache/save@v4

        with:
          path: results/alert-state-regression.json
          key: clinic-monitoring-alert-regression-${{ github.run_id }}

      - name: Mark monitor run as failed
        if: steps.monitor.outputs.exit_code != '0'
        run: exit 1
