name: Email Alarm Test (v2)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  email-test:
    name: Send a harmless test email
    runs-on: ubuntu-22.04
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Send test email
        env:
          MAIL_SERVER_ADDRESS: ${{ secrets.MAIL_SERVER_ADDRESS }}
          MAIL_SERVER_PORT: ${{ secrets.MAIL_SERVER_PORT }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_SENDER_ADDRESS: ${{ secrets.MAIL_SENDER_ADDRESS }}
          MAIL_RECIPIENT_ADDRESS: ${{ secrets.MAIL_RECIPIENT_ADDRESS }}
        run: |
          python scripts/send_alert.py \
            --monitor "Peoples Clinic Monitoring v2" \
            --test-email
