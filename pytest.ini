[pytest]
addopts =
    -ra
    --strict-markers
    --screenshot=only-on-failure
    --tracing=retain-on-failure
    --video=retain-on-failure
    --output=test-results
testpaths = tests
python_files = test_*.py
markers =
    smoke: fast, high-frequency availability checks
    regression: complete consultation UI/API journey
    fnx: FNX parser or analytics checks
    parser: deterministic file parser checks
    ai: nondeterministic AI checks with factual anchors
